[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zebra_dev"               # install name 
version = "0.1.0"
requires-python = ">=3.10"
description = "Zebrafish development utilities and models"
readme = "README.md"
authors = [{ name = "You" }]
dependencies = [
  "numpy", "pandas", "polars", "torch", "matplotlib", "seaborn"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zebra_dev*"]         # include subpackages
